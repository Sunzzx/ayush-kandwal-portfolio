  <text x="300" y="580" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">TENSURA</text>
  <text x="300" y="615" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="2">THAT TIME I GOT REINCARNATED AS A SLIME</text>
  <text x="300" y="650" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">"Wisdom King Raphael &bull; Sovereign Gluttony"</text>
