      <stop offset="0%" stop-color="#030814"/>
      <stop offset="60%" stop-color="#0a1f38"/>
      <stop offset="100%" stop-color="#010307"/>
    </linearGradient>
    <radialGradient id="predator" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
